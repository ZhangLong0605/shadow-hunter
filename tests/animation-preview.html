<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>猎人动作检查</title><base href="../dist/">
<style>*{box-sizing:border-box}body{margin:0;background:#0c191d;color:#c9dfd3;font:14px system-ui}header{padding:20px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}button{background:#213c3a;color:#d4e6d6;border:1px solid #52776c;border-radius:4px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#95b6a3;color:#132926}label{display:flex;gap:8px;align-items:center}canvas{display:block;width:100%;height:auto}p{padding:0 28px;color:#96aca2}</style>
<header><h1>猎人动作 · 八方向</h1><button data-mode="walk" aria-pressed="true">迈步</button><button data-mode="blade">挥刃</button><button data-mode="bow">拉弓</button><button data-mode="idle">待机</button><button id="pause">暂停动画</button><label>动作进度 <input id="phase" type="range" min="0" max="100" value="25"></label><span id="cost"></span></header>
<canvas id="preview" width="1280" height="660" aria-label="八方向人物关节动作预览"></canvas><p>本页仅检查角色动作，不读取或写入游戏存档。步态按实际行进距离推进；挥斩包含抬臂、出手与收势。</p>
<script src="art.js"></script><script>
const canvas=document.getElementById('preview'),g=canvas.getContext('2d'),art=window.HUNTER_ART;
let mode='walk',running=true,t=0,last=0,cost=0,count=0,dirty=true;
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;dirty=true;document.querySelectorAll('[data-mode]').forEach(n=>n.setAttribute('aria-pressed',n===b));});
document.getElementById('pause').onclick=()=>{running=!running;dirty=true;document.getElementById('pause').textContent=running?'暂停动画':'播放动画';};
document.getElementById('phase').oninput=e=>{t=e.target.value/100;dirty=true;running=false;document.getElementById('pause').textContent='播放动画';};
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(running)t=(t+dt*.7)%1;if(!running&&!dirty){requestAnimationFrame(frame);return;}dirty=false;const start=performance.now();g.fillStyle='#10252a';g.fillRect(0,0,1280,660);
 const names=['东','东南','南','西南','西','西北','北','东北'];
 for(let i=0;i<8;i++){const x=(i%4)*320+160,y=Math.floor(i/4)*330+275,angle=i*Math.PI/4,m=art.createMotion();
  m.motionTime=t*3;m.stridePhase=t*Math.PI*2;m.moveBlend=mode==='walk'?1:0;m.moveHeading=angle;
  if(mode==='blade'){art.beginAttack(m,'blade',angle);m.attackPoseTime=(1-t)*m.attackPoseDuration;}
  if(mode==='bow'){m.attackPoseWeapon='bow';m.charging=t*.6;}
  g.strokeStyle='#36564f';g.lineWidth=1;g.beginPath();g.moveTo(x-120,y+26);g.lineTo(x+120,y+26);g.stroke();
  g.fillStyle='#a2b9ac';g.font='13px system-ui';g.textAlign='center';g.fillText(names[i],x,y-240);
  art.hunter(g,x,y,angle,'#b4dbc2',2.4,false,m.motionTime,mode==='walk',mode==='bow'?'bow':'blade',m);
 }
 cost+=performance.now()-start;if(++count===30){document.getElementById('cost').textContent='8 角色绘制 '+(cost/count).toFixed(1)+' ms';count=cost=0;}requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
